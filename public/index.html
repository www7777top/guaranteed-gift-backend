<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gift Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f0b14;
    --bg-2: #150f1c;
    --surface: #1c1524;
    --surface-2: #241b2e;
    --line: rgba(245,240,230,0.08);
    --gold: #c9a227;
    --gold-soft: #e6c76a;
    --violet: #7b5fff;
    --text: #f5f0e6;
    --muted: #9a8fa8;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(123,95,255,0.18), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(201,162,39,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}

  /* Header */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(15,11,20,0.97), rgba(15,11,20,0.86) 70%, rgba(15,11,20,0));
    backdrop-filter:blur(10px);
    padding:16px 16px 10px;
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand-left{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold) 60%, #8a6d10);
    display:flex;align-items:center;justify-content:center;font-size:17px;
    box-shadow:0 2px 10px rgba(201,162,39,0.35);
  }
  .brand h1{font-size:19px; font-weight:600; letter-spacing:0.2px;}
  .brand span.sub{display:block; font-size:11px; color:var(--muted); font-family:'Manrope'; margin-top:1px; letter-spacing:0.3px;}
  .balance-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--line);
    padding:7px 12px; border-radius:100px; font-size:13px; font-weight:700;
    color:var(--gold-soft);
  }

  /* Category chips */
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:8px 15px; border-radius:100px;
    background:var(--surface); border:1px solid var(--line);
    color:var(--muted); font-size:13px; font-weight:600;
    white-space:nowrap; cursor:pointer; transition:all .15s ease;
  }
  .chip.active{
    background:linear-gradient(135deg, var(--violet), #5a3fe0);
    color:#fff; border-color:transparent;
  }

  /* Search */
  .search-wrap{padding:12px 16px 4px;}
  .search-wrap input{
    width:100%; padding:12px 14px; border-radius:14px;
    background:var(--surface); border:1px solid var(--line);
    color:var(--text); font-size:14px; font-family:'Manrope';
  }
  .search-wrap input::placeholder{color:var(--muted);}
  .search-wrap input:focus{outline:none; border-color:var(--violet);}

  /* Grid */
  .grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:12px; padding:14px 16px 20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    position:relative;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:active{transform:scale(0.97);}
  .card-photo{
    width:100%; aspect-ratio:1/1;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .card-photo img{width:100%; height:100%; object-fit:cover;}
  .card-photo .placeholder{font-size:34px; opacity:0.35;}
  .card-body{padding:10px 12px 12px;}
  .card-name{
    font-size:13.5px; font-weight:700; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    min-height:34px;
  }
  .card-cat{font-size:10.5px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:0.5px;}

  /* gift-tag price badge — signature element */
  .price-tag{
    margin-top:10px; display:inline-flex; align-items:center; gap:5px;
    background:linear-gradient(135deg, rgba(201,162,39,0.16), rgba(201,162,39,0.06));
    border:1px solid rgba(201,162,39,0.4);
    padding:5px 10px 5px 8px;
    border-radius:0 8px 8px 0;
    position:relative;
    font-weight:800; font-size:13.5px; color:var(--gold-soft);
  }
  .price-tag::before{
    content:'';
    position:absolute; left:-7px; top:50%; transform:translateY(-50%);
    width:12px; height:12px; border-radius:50%;
    background:var(--bg); border:1px solid rgba(201,162,39,0.4);
  }
  .price-tag::after{
    content:'';
    position:absolute; left:-1px; top:50%; transform:translateY(-50%);
    width:4px; height:4px; border-radius:50%;
    background:rgba(201,162,39,0.4);
  }

  .empty, .loading{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted);
  }
  .empty h3{color:var(--text); font-size:18px; margin-bottom:6px;}
  .empty p{font-size:13px; margin-top:4px;}

  /* Product sheet (bottom sheet on tap) */
  .overlay{
    position:fixed; inset:0; background:rgba(6,4,9,0.6);
    backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:40;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--bg-2);
    border-radius:22px 22px 0 0;
    border-top:1px solid var(--line);
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.32,.72,0,1);
    z-index:41;
    max-height:85vh; overflow-y:auto;
    padding-bottom:24px;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:38px; height:4px; background:var(--line); border-radius:4px; margin:10px auto 4px;}
  .sheet-photo{width:100%; aspect-ratio:4/3; background:var(--surface-2); object-fit:cover;}
  .sheet-body{padding:16px 20px 0;}
  .sheet-body h2{font-size:21px; font-weight:600; margin-bottom:6px;}
  .sheet-body .sheet-cat{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .sheet-desc{font-size:14px; color:#cfc7dd; line-height:1.55; margin-top:12px;}
  .sheet-price{font-family:'Fraunces'; font-size:26px; font-weight:600; color:var(--gold-soft); margin-top:16px;}
  .sheet-btn{
    margin-top:16px; width:100%; padding:15px; border:none; border-radius:14px;
    background:linear-gradient(135deg, var(--violet), #5a3fe0);
    color:#fff; font-family:'Manrope'; font-weight:700; font-size:15px;
    cursor:pointer;
  }
  .close-x{
    position:absolute; top:14px; right:14px; width:30px; height:30px;
    border-radius:50%; background:rgba(0,0,0,0.35); border:1px solid var(--line);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    font-size:15px; cursor:pointer; z-index:2;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-left">
      <div class="brand-mark">🎁</div>
      <div>
        <h1>Gift Market</h1>
        <span class="sub">Каталог подарков</span>
      </div>
    </div>
    <div class="balance-pill">✨ <span id="countBadge">0</span></div>
  </div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Найти подарок...">
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="grid" id="grid">
  <div class="loading">Загружаем витрину...</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="close-x" id="sheetClose">✕</div>
  <div class="sheet-handle"></div>
  <img class="sheet-photo" id="sheetPhoto" src="" alt="">
  <div class="sheet-body">
    <div class="sheet-cat" id="sheetCat"></div>
    <h2 id="sheetName"></h2>
    <div class="sheet-desc" id="sheetDesc"></div>
    <div class="sheet-price" id="sheetPrice"></div>
    <button class="sheet-btn" id="sheetBtn">Заказать в чате</button>
  </div>
</div>

<script>
  // ⚠️ укажите адрес вашего бэкенда на Render
  const API_BASE = 'https://guaranteed-gift-backend.onrender.com';

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  let products = [];
  let activeCategory = 'Все';

  const grid = document.getElementById('grid');
  const chips = document.getElementById('chips');
  const searchInput = document.getElementById('searchInput');
  const countBadge = document.getElementById('countBadge');

  function formatPrice(p){
    return new Intl.NumberFormat('ru-RU').format(p) + ' ₽';
  }

  async function loadProducts(){
    try {
      const res = await fetch(`${API_BASE}/api/products`);
      products = await res.json();
      countBadge.textContent = products.length;
      renderChips();
      renderGrid();
    } catch (e) {
      grid.innerHTML = `<div class="empty"><h3>Не удалось загрузить</h3><p>Проверьте подключение и адрес сервера</p></div>`;
    }
  }

  function renderChips(){
    const cats = ['Все', ...new Set(products.map(p => p.category).filter(Boolean))];
    chips.innerHTML = cats.map(c =>
      `<div class="chip ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c}</div>`
    ).join('');
    chips.querySelectorAll('.chip').forEach(el => {
      el.addEventListener('click', () => {
        activeCategory = el.dataset.cat;
        renderChips();
        renderGrid();
      });
    });
  }

  function renderGrid(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = products.filter(p => {
      const matchCat = activeCategory === 'Все' || p.category === activeCategory;
      const matchQ = !q || p.name.toLowerCase().includes(q);
      return matchCat && matchQ;
    });

    if (!filtered.length){
      grid.innerHTML = `<div class="empty"><h3>Пока пусто 🎈</h3><p>Здесь появятся подарки, как только их добавят</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <div class="card" data-id="${p.id}">
        <div class="card-photo">
          ${p.photoUrl ? `<img src="${p.photoUrl}" alt="${p.name}">` : `<span class="placeholder">🎁</span>`}
        </div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          ${p.category ? `<div class="card-cat">${p.category}</div>` : ''}
          <div class="price-tag">${formatPrice(p.price)}</div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openSheet(card.dataset.id));
    });
  }

  searchInput.addEventListener('input', renderGrid);

  // Bottom sheet
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');

  function openSheet(id){
    const p = products.find(x => x.id === id);
    if (!p) return;
    document.getElementById('sheetPhoto').src = p.photoUrl || '';
    document.getElementById('sheetPhoto').style.display = p.photoUrl ? 'block' : 'none';
    document.getElementById('sheetCat').textContent = p.category || '';
    document.getElementById('sheetName').textContent = p.name;
    document.getElementById('sheetDesc').textContent = p.description || '';
    document.getElementById('sheetPrice').textContent = formatPrice(p.price);
    document.getElementById('sheetBtn').onclick = () => {
      if (tg) {
        tg.sendData(JSON.stringify({ action: 'order', productId: p.id, name: p.name, price: p.price }));
      } else {
        alert('Заказ: ' + p.name);
      }
    };
    overlay.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheet(){
    overlay.classList.remove('open');
    sheet.classList.remove('open');
  }
  overlay.addEventListener('click', closeSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);

  loadProducts();
</script>
</body>
</html>
